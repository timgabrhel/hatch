[package]
name = "hatch-cli"
version = "0.5.1"
edition = "2021"
publish = false
default-run = "hatch"
description = "Enter devcontainers and launch coding agents"

[[bin]]
name = "hatch"
path = "src/main.rs"

# Disposable process doubles used by integration tests; never packaged/installed.
[[bin]]
name = "hatch-test-fixture"
path = "tests/support/fixture.rs"
test = false
doc = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", default-features = false }

[dev-dependencies]
libc = "0.2"
