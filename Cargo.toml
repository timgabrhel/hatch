[package]
name = "hatch-cli"
version = "0.5.1"
edition = "2021"
publish = false
description = "Enter devcontainers and launch coding agents"

[[bin]]
name = "hatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", default-features = false }
